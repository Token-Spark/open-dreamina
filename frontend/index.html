<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <link rel="icon" type="image/x-icon" href="/src/static/128.ico" />
    <title>Open Dreamina</title>
    <script>
      // Pre-paint theme bootstrap: avoids a flash of the wrong palette by
      // applying the saved / system-preferred theme before React mounts.
      (function () {
        try {
          var key = 'aigc-studio.theme';
          var saved = localStorage.getItem(key);
          var prefersLight =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = saved === 'dark' || saved === 'light'
            ? saved
            : (prefersLight ? 'light' : 'dark');
          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
        } catch (e) {
          /* fall back to the default `dark` class already on <html>. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
