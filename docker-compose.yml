services:
  frontend:
    build: ./frontend
    ports:
      - "10131:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "10130:10130"
    volumes:
      - ./data:/app/data
      # 开发模式：挂载源码目录，修改 backend/app 下代码无需重新 build 镜像
      - ./backend/app:/app/app:cached
    environment:
      - DATABASE_URL=sqlite:///./data/db/aigc_studio.db
      - REDIS_URL=redis://redis:6379/0
      - ASSETS_DIR=/app/data/assets
      - BACKUP_DIR=/app/data/backups
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-d3fault-encryption-key-change-me-please-32b}
    extra_hosts:
      # 让容器内可通过 host.docker.internal 访问宿主机服务（如本地部署的 AIGC API）
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    # 开发模式：--reload 让 API 代码改动自动热加载（仅开发用，生产部署请移除）
    command: uvicorn app.main:app --host 0.0.0.0 --port 10130 --reload --reload-dir /app/app

  celery-worker:
    build: ./backend
    volumes:
      - ./data:/app/data
      # 开发模式：挂载源码目录；celery 不支持热加载，改代码后需 docker compose restart celery-worker
      - ./backend/app:/app/app:cached
    environment:
      - DATABASE_URL=sqlite:///./data/db/aigc_studio.db
      - REDIS_URL=redis://redis:6379/0
      - ASSETS_DIR=/app/data/assets
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-d3fault-encryption-key-change-me-please-32b}
      # 即梦 CLI：HOME 指向挂载卷内的持久化目录，CLI 二进制与 ~/.dreamina_cli 登录态
      # 在容器重建后不丢失（安装/登录引导见 设置 → 服务管理 → 即梦 CLI）
      - HOME=/app/data/dreamina-home
    extra_hosts:
      # 让容器内可通过 host.docker.internal 访问宿主机服务（如本地部署的 AIGC API）
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    restart: unless-stopped
    command: sh -c "mkdir -p /app/data/dreamina-home && exec celery -A app.worker worker --loglevel=info --concurrency=2"

  celery-beat:
    build: ./backend
    volumes:
      - ./data:/app/data
      # 开发模式：挂载源码目录；改代码后需 docker compose restart celery-beat
      - ./backend/app:/app/app:cached
    environment:
      - DATABASE_URL=sqlite:///./data/db/aigc_studio.db
      - REDIS_URL=redis://redis:6379/0
      - BACKUP_DIR=/app/data/backups
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-d3fault-encryption-key-change-me-please-32b}
    depends_on:
      - redis
    restart: unless-stopped
    command: celery -A app.worker beat --loglevel=info

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
